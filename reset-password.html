<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password | JurisCards</title>
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#071525">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="juris.css">
  <style>
    .auth-one { max-width: 460px; margin: 0 auto; padding: 60px 0 80px; }
    .auth-one h1 { font-size: clamp(30px, 4vw, 40px); line-height: 1.15; margin-bottom: 12px; }
    .auth-one > p { color: var(--muted); font-size: 15px; margin-bottom: 22px; }
  </style>
</head>
<body class="jc-page">
  <header>
    <div class="container navbar">
      <a href="index.html" class="logo"><img class="logo-icon" src="icons/icon.svg" alt="" width="34" height="34">JurisCards</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="browse.html">Browse</a>
        <a href="flashcard.html">Flashcards</a>
        <a href="review.html">Review</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container auth-one">
      <h1>Choose a new password.</h1>
      <p>This signs you out on every other device. The same account works on L-Lawliet and JurisCards Arena.</p>
      <section class="jc-panel">
        <form id="resetForm" novalidate>
          <input type="text" autocomplete="username" hidden>
          <div class="jc-field">
            <label for="newPassword">New password</label>
            <input id="newPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
            <p class="jc-hint">At least 8 characters, with a letter and a number.</p>
          </div>
          <div class="jc-field">
            <label for="newPassword2">Confirm new password</label>
            <input id="newPassword2" type="password" autocomplete="new-password" required>
          </div>
          <button class="jc-btn gold wide" id="resetBtn" type="submit">Save new password</button>
        </form>
        <p class="jc-msg" id="resetMsg" role="status"></p>
      </section>
    </div>
  </main>

  <footer>
    <div class="container footer-content">
      <div class="footer-logo"><img class="logo-icon" src="icons/icon.svg" alt="" width="34" height="34"> JurisCards</div>
      <div>Law data from the L-Lawliet database &middot; &copy; 2026 JurisCards</div>
    </div>
  </footer>

  <script src="juris.js"></script>
  <script>
  (function () {
      const { API, saveSession, errorMessage } = Juris;
      const $ = id => document.getElementById(id);
      const msg = $("resetMsg");
      function say(text, ok, link) {
          msg.className = "jc-msg " + (ok ? "ok" : "err");
          msg.textContent = text;
          if (link) { msg.append(" "); const a = document.createElement("a"); a.href = link[0]; a.textContent = link[1]; msg.append(a); a.focus(); }
      }

      // The token arrives in the fragment (#token=...), which is never sent to a server.
      const token = new URLSearchParams(location.hash.slice(1)).get("token");
      if (location.hash) history.replaceState(null, "", location.pathname);
      if (!token) {
          $("resetForm").hidden = true;
          say("This page needs the link from your reset email.", false, ["login.html#forgot", "Ask for a new link"]);
          return;
      }

      $("resetForm").addEventListener("submit", async e => {
          e.preventDefault();
          const password = $("newPassword").value;
          if (password !== $("newPassword2").value) { say("The passwords do not match.", false); return; }
          $("resetBtn").disabled = true;
          msg.textContent = "";
          try {
              const res = await fetch(API + "/auth/reset-password", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ token, new_password: password }),
              });
              if (!res.ok) {
                  say(await errorMessage(res), false, res.status === 400 ? ["login.html#forgot", "Send a new link"] : null);
                  return;
              }
              saveSession(await res.json());
              $("resetForm").hidden = true;
              say("Password changed. You are signed in on this device.", true, ["index.html", "Go to JurisCards"]);
          } catch {
              say("Could not reach the server. Please try again.", false);
          } finally {
              $("resetBtn").disabled = false;
          }
      });
  })();
  </script>
</body>
</html>
