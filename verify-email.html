<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm email | JurisCards</title>
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#071525">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="juris.css">
  <style>
    .auth-one { max-width: 460px; margin: 0 auto; padding: 60px 0 80px; }
    .auth-one h1 { font-size: clamp(30px, 4vw, 40px); line-height: 1.15; margin-bottom: 12px; }
    .auth-one > p { color: var(--muted); font-size: 15px; margin-bottom: 22px; }
  </style>
</head>
<body class="jc-page">
  <header>
    <div class="container navbar">
      <a href="index.html" class="logo"><img class="logo-icon" src="icons/icon.svg" alt="" width="34" height="34">JurisCards</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="browse.html">Browse</a>
        <a href="flashcard.html">Flashcards</a>
        <a href="review.html">Review</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container auth-one">
      <h1>Confirm your email.</h1>
      <section class="jc-panel">
        <p class="jc-msg" id="status" role="status" style="margin-top: 0;">Confirming…</p>
        <a class="guest-link" href="index.html">Go to JurisCards</a>
      </section>
    </div>
  </main>

  <footer>
    <div class="container footer-content">
      <div class="footer-logo"><img class="logo-icon" src="icons/icon.svg" alt="" width="34" height="34"> JurisCards</div>
      <div>Law data from the L-Lawliet database &middot; &copy; 2026 JurisCards</div>
    </div>
  </footer>

  <script src="juris.js"></script>
  <script>
  (async function () {
      const { API, errorMessage } = Juris;
      const status = document.getElementById("status");
      // Token from the fragment (never sent to a server), then cleared from the address bar.
      const token = new URLSearchParams(location.hash.slice(1)).get("token");
      if (location.hash) history.replaceState(null, "", location.pathname);
      if (!token) { status.className = "jc-msg err"; status.textContent = "This page needs the link from your confirmation email."; return; }
      try {
          const res = await fetch(API + "/auth/verify-email", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token }),
          });
          if (!res.ok) {
              status.className = "jc-msg err";
              status.textContent = (await errorMessage(res)) + " You can send a new link from Settings.";
              return;
          }
          const data = await res.json();
          status.className = "jc-msg ok";
          status.textContent = `${data.email} is confirmed for @${data.username}. If you forget your password, use "Forgot password?" on the sign-in page.`;
      } catch {
          status.className = "jc-msg err";
          status.textContent = "Could not reach the server. Please reload the link.";
      }
  })();
  </script>
</body>
</html>
